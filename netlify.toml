[build]
command = "export DATABASE_URL=\"${NETLIFY_DATABASE_URL:-$DATABASE_URL}\" && NITRO_PRESET=netlify pnpm build && if [ \"${CONTEXT:-}\" = \"production\" ]; then pnpm migrate:production; fi"
publish = "dist"
functions = ".netlify/functions-internal"

[build.environment]
# Pas de GA_MEASUREMENT_ID ni de GTM_CONTAINER_ID ici, et c'est délibéré.
#
# Le gabarit en livrait deux, pointant vers une propriété qui n'appartient pas à ce
# projet : tout déploiement aurait envoyé les statistiques de ses visiteurs à un
# tiers. Pour une application dont la promesse tient en « aucune donnée qui part
# ailleurs », c'était intenable — y compris sur le chemin déployé, que personne ne
# lit avant de cliquer.
#
# Qui veut mesurer son propre trafic pose sa variable dans l'interface Netlify, là
# où elle n'est pas publiée dans un dépôt public.
NITRO_PRESET = "netlify"
NPM_CONFIG_PRODUCTION = "false"

[context.production.environment]
AGENT_NATIVE_HOSTED_HARNESS = "true"
AGENT_NATIVE_ENABLE_KEEP_WARM = "1"
AGENT_NATIVE_DISABLE_KEEP_WARM_BACKGROUND = "1"
BETTER_AUTH_TRUSTED_ORIGINS = "https://starter.agent-native.com,https://chat.agent-native.com"
# Production release migrations own schema setup; request functions must skip
# migration probes on every serverless invocation.
AGENT_NATIVE_RELEASE_MIGRATIONS = "1"
